<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Club Corner College Portal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page-body">

    <!-- Top Minimal Navigation -->
    <header class="site-header" style="background: transparent; border-bottom: none;">
        <div class="container navbar">
            <a href="index.html" class="brand-logo">
                <div class="brand-icon">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <span>Club Corner</span>
            </a>
            <div class="nav-actions">
                <a href="index.html" class="btn btn-outline btn-sm">
                    <i class="fa-solid fa-arrow-left"></i> Back to Home
                </a>
            </div>
        </div>
    </header>

    <!-- Login Centered Card -->
    <div class="login-container-wrapper">
        <div class="login-card">
            
            <div class="login-header">
                <div class="login-header-icon" id="login-header-icon">
                    <i class="fa-solid fa-user-graduate"></i>
                </div>
                <h2 class="login-title">Portal Login</h2>
                <p class="login-subtitle">Sign in to manage student clubs or explore activities</p>
            </div>

            <!-- Role Selector Tabs -->
            <div class="role-selector" role="tablist">
                <button type="button" class="role-tab-btn active" id="tab-student" data-role="student">
                    <i class="fa-solid fa-user-graduate"></i> Student Login
                </button>
                <button type="button" class="role-tab-btn" id="tab-teacher" data-role="teacher">
                    <i class="fa-solid fa-chalkboard-user"></i> Teacher / Faculty
                </button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="login-form" novalidate>
                <input type="hidden" id="login-selected-role" value="student">

                <div class="form-group">
                    <label class="form-label" for="login-email">
                        <i class="fa-regular fa-envelope"></i> Email or Username
                    </label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-at"></i>
                        <input type="email" id="login-email" class="form-control" placeholder="e.g. student@college.com" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="login-password">
                        <i class="fa-solid fa-lock"></i> Password
                    </label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-key"></i>
                        <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="password-toggle-btn" id="password-toggle-btn" aria-label="Toggle password visibility">
                            <i class="fa-regular fa-eye" id="toggle-eye-icon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100" id="login-submit-btn" style="margin-top: 1.25rem;">
                    <i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard
                </button>
            </form>

            <!-- 1-Click Demo Accounts Box -->
            <div class="demo-accounts-box">
                <div class="demo-accounts-title">
                    <i class="fa-solid fa-bolt text-warning"></i> Quick Demo Accounts (Click to Fill)
                </div>
                <div class="demo-account-buttons">
                    <button type="button" class="demo-pill-btn" data-demo="student" id="demo-student-btn">
                        <span class="demo-pill-role">
                            <i class="fa-solid fa-user-graduate"></i> Student Demo
                        </span>
                        <span class="demo-pill-email">student@college.com</span>
                    </button>

                    <button type="button" class="demo-pill-btn" data-demo="teacher" id="demo-teacher-btn">
                        <span class="demo-pill-role">
                            <i class="fa-solid fa-chalkboard-user"></i> Teacher Demo
                        </span>
                        <span class="demo-pill-email">teacher@college.com</span>
                    </button>
                </div>
            </div>

            <!-- Dean Portal Segregated Link -->
            <div style="margin-top: 1.25rem; padding: 0.75rem 1rem; background: #fffbeb; border: 1px solid #fde68a; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;">
                <div style="font-size: 0.8rem; color: #92400e;">
                    <i class="fa-solid fa-shield-halved text-warning"></i> <strong>Dean / Super Admin?</strong>
                </div>
                <a href="dean-login.html" class="btn btn-sm" style="background: #d97706; color: #ffffff; padding: 0.35rem 0.75rem; font-size: 0.8rem;">
                    Access Dean Portal &rarr;
                </a>
            </div>

            <div class="login-back-link">
                <a href="index.html" class="text-muted">
                    <i class="fa-solid fa-arrow-left"></i> Return to Homepage
                </a>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Check if already logged in as student or teacher
            auth.redirectIfLoggedIn('standard');

            // If currently logged in as Dean, show indicator
            const currentUser = auth.getCurrentUser();
            if (currentUser && currentUser.role === 'dean') {
                const notice = document.createElement('div');
                notice.style.cssText = 'background:#fef3c7; border:1px solid #fde68a; border-radius:8px; padding:0.6rem 0.85rem; font-size:0.8rem; margin-bottom:1rem; display:flex; align-items:center; justify-content:space-between; color:#92400e;';
                notice.innerHTML = `
                    <span>Signed in as Dean: <strong>${currentUser.name}</strong></span>
                    <div>
                        <a href="dean-dashboard.html" class="btn btn-sm" style="background:#d97706; color:#fff; padding:0.2rem 0.5rem; font-size:0.75rem; margin-right:4px;">Dean Dashboard</a>
                        <button type="button" class="btn btn-outline btn-sm" style="padding:0.2rem 0.5rem; font-size:0.75rem;" onclick="auth.logout()">Logout</button>
                    </div>
                `;
                const form = document.getElementById('login-form');
                if (form) form.parentNode.insertBefore(notice, form);
            }

            const roleInput = document.getElementById('login-selected-role');
            const tabStudent = document.getElementById('tab-student');
            const tabTeacher = document.getElementById('tab-teacher');
            const headerIcon = document.getElementById('login-header-icon');
            const emailInput = document.getElementById('login-email');
            const passwordInput = document.getElementById('login-password');
            const submitBtn = document.getElementById('login-submit-btn');

            // Role Tab Switching
            tabStudent.addEventListener('click', () => {
                tabStudent.classList.add('active');
                tabTeacher.classList.remove('active');
                roleInput.value = 'student';
                headerIcon.innerHTML = '<i class="fa-solid fa-user-graduate"></i>';
                headerIcon.style.color = 'var(--primary)';
                headerIcon.style.background = 'var(--primary-50)';
                submitBtn.className = 'btn btn-primary btn-lg w-100';
            });

            tabTeacher.addEventListener('click', () => {
                tabTeacher.classList.add('active');
                tabStudent.classList.remove('active');
                roleInput.value = 'teacher';
                headerIcon.innerHTML = '<i class="fa-solid fa-chalkboard-user"></i>';
                headerIcon.style.color = '#0d9488';
                headerIcon.style.background = '#ccfbf1';
                submitBtn.className = 'btn btn-lg w-100';
                submitBtn.style.background = '#0d9488';
                submitBtn.style.color = '#fff';
            });

            // Demo Autofill Buttons
            document.getElementById('demo-student-btn').addEventListener('click', () => {
                tabStudent.click();
                emailInput.value = 'student@college.com';
                passwordInput.value = 'student123';
                auth.showToast('Student credentials filled!', 'info');
            });

            document.getElementById('demo-teacher-btn').addEventListener('click', () => {
                tabTeacher.click();
                emailInput.value = 'teacher@college.com';
                passwordInput.value = 'teacher123';
                auth.showToast('Teacher credentials filled!', 'info');
            });

            // Password Toggle
            const toggleBtn = document.getElementById('password-toggle-btn');
            const eyeIcon = document.getElementById('toggle-eye-icon');
            toggleBtn.addEventListener('click', () => {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    eyeIcon.className = 'fa-regular fa-eye-slash';
                } else {
                    passwordInput.type = 'password';
                    eyeIcon.className = 'fa-regular fa-eye';
                }
            });

            // Form Submit
            document.getElementById('login-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const email = emailInput.value.trim();
                const password = passwordInput.value;
                const role = roleInput.value;

                if (!email || !password) {
                    auth.showToast('Please enter both email and password.', 'warning');
                    return;
                }

                const result = auth.login(email, password, role);
                if (result.success) {
                    auth.showToast(`Welcome back, ${result.user.name}! Redirecting...`, 'success');
                    setTimeout(() => {
                        if (result.user.role === 'student') {
                            window.location.href = 'student-dashboard.html';
                        } else if (result.user.role === 'teacher') {
                            window.location.href = 'teacher-dashboard.html';
                        }
                    }, 600);
                } else {
                    auth.showToast(result.message, 'error');
                }
            });
        });
    </script>
</body>
</html>
